owner: octogee-ai
repo: status

assignees:
  - ceckert

secrets:
  - NOTIFICATION_DISCORD_WEBHOOK_URL

sites:
  - name: Website
    url: https://octogee.com/
    slug: website
  - name: App
    url: https://app.octogee.com/
    slug: app
  - name: API
    url: https://api.octogee.com/api/health
    slug: api
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: Workspace connections
    url: https://api.octogee.com/health
    slug: workspace-connections
    __dangerous__body_down_if_text_missing: '"status":"ok"'

status-website:
  cname: status.octogee.com
  name: Octogee Status
  themeUrl: /octogee.css
  logoUrl: https://octogee.com/ds/assets/octo-mascot.svg
  favicon: https://octogee.com/favicon.png
  faviconSvg: https://octogee.com/favicon.svg
  introTitle: "**Octogee** status"
  introMessage: >-
    Live uptime and response times for Octogee, checked every five minutes. Outages show up here automatically.
    Octogee also relies on these providers:
    [Google Cloud](https://status.cloud.google.com/) ·
    [Google Workspace](https://www.google.com/appsstatus/dashboard/) ·
    [GitHub](https://www.githubstatus.com/) ·
    [Anthropic](https://status.claude.com/) ·
    [OpenAI](https://status.openai.com/)
  navbar:
    - title: Status
      href: /
    - title: Octogee
      href: https://octogee.com
